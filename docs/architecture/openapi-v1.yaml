  /messages/client:
    get:
      summary: List current client thread messages
    post:
      summary: Send message as authenticated client
      parameters:
        - in: header
          name: idempotency-key
          schema: { type: string }
  /messages/client/read:
    put:
      summary: Mark team messages as read for current client thread
      parameters:
        - in: header
          name: idempotency-key
          schema: { type: string }
  /messages/team/{clientId}:
    get:
      summary: List client thread messages for authorized team member
  /messages/team/{clientId}/send:
    post:
