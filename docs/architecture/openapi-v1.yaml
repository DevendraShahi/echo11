          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: tagId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: idempotency-key
          schema: { type: string }
    delete:
      summary: Remove tag from project
      parameters:
        - in: path
          name: projectId
