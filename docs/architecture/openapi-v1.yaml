openapi: 3.1.0
info:
  title: Echo11 API v1
  version: 1.0.0
  description: |
    Unified API surface for lab/client/admin domains with idempotent writes,
    optimistic concurrency, and event/audit metadata.
servers:
  - url: /api/v1
components:
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    MutationMeta:
      type: object
      required: [resource_id, lock_version, event_id, correlation_id]
      properties:
        resource_id:
          type: string
          format: uuid
        lock_version:
          type: integer
          nullable: true
        event_id:
          type: string
          format: uuid
          nullable: true
        correlation_id:
          type: string
          format: uuid
    ApiSuccess:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/MutationMeta'
    ApiFailure:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'
paths:
  /internal/outbox/dispatch:
    post:
      summary: Dispatch pending domain events and refresh projections (internal)
      parameters:
        - in: header
          name: x-outbox-dispatch-secret
          required: true
          schema: { type: string }
  /internal/outbox/metrics:
    get:
      summary: Read outbox lag/retry/projection staleness metrics (internal)
      parameters:
        - in: header
          name: x-outbox-dispatch-secret
          required: true
          schema: { type: string }
  /internal/outbox/health:
    get:
      summary: Evaluate outbox health against configured alert thresholds (internal)
      parameters:
        - in: header
          name: x-outbox-dispatch-secret
          required: true
          schema: { type: string }
  /teams:
    get:
      summary: List teams
    post:
      summary: Create team
      parameters:
        - in: header
          name: idempotency-key
          schema: { type: string }
  /teams/{teamId}:
    get:
      summary: Get team
    patch:
      summary: Update team
      parameters:
        - in: path
          name: teamId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: idempotency-key
          schema: { type: string }
    delete:
      summary: Delete team
      parameters:
        - in: path
          name: teamId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: idempotency-key
          schema: { type: string }
  /teams/{teamId}/members:
    post:
      summary: Assign user to team
      parameters:
        - in: path
          name: teamId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: idempotency-key
          schema: { type: string }
    delete:
      summary: Remove user from team
      parameters:
        - in: path
          name: teamId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: user_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: idempotency-key
          schema: { type: string }
  /teams/{teamId}/lead:
    put:
      summary: Set team lead
      parameters:
        - in: header
          name: idempotency-key
          schema: { type: string }
  /teams/{teamId}/moodboard/messages:
    post:
      summary: Create team moodboard message
      parameters:
        - in: path
          name: teamId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: idempotency-key
          schema: { type: string }
  /teams/{teamId}/moodboard/notes:
    post:
      summary: Create team moodboard note
      parameters:
        - in: path
          name: teamId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: idempotency-key
          schema: { type: string }
  /identity/memberships/{memberId}/role:
    put:
      summary: Update member role
      parameters:
        - in: header
          name: idempotency-key
          schema: { type: string }
  /identity/profile:
